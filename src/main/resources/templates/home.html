<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trang chủ - Article')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="main">
    <div class="page-header">
        <h1>Bài viết</h1>
        <a class="btn-primary btn-inline" th:href="@{/articles/new}">Tạo bài viết</a>
    </div>

    <form class="search-bar" th:action="@{/home}" method="get">
        <input type="text"
               name="tag"
               class="search-input"
               placeholder="Tìm theo tag..."
               th:value="${searchTag}">
        <button type="submit" class="search-btn" aria-label="Tìm kiếm">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.65" y1="16.65" x2="21" y2="21"/>
            </svg>
        </button>
    </form>

    <div class="empty-state" th:if="${#lists.isEmpty(articles) and searchTag != null}">
        <p th:text="'Không tìm thấy bài viết với tag &quot;' + ${searchTag} + '&quot;'">
            Không tìm thấy bài viết với tag này.
        </p>
        <a class="btn-secondary btn-inline" th:href="@{/home}">Xem tất cả bài viết</a>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(articles) and searchTag == null}">
        <p>Chưa có bài viết nào. Hãy tạo bài viết đầu tiên!</p>
    </div>

    <div class="article-list" th:if="${!#lists.isEmpty(articles)}">
        <a class="article-card" th:each="article : ${articles}" th:href="@{/articles/{id}(id=${article.id})}">
            <span class="article-tag" th:text="${article.tag}">tag</span>
            <h2 class="article-title" th:text="${article.title}">Title</h2>
            <p class="article-description" th:text="${article.description}">Description</p>
            <span class="article-meta" th:text="'bởi ' + ${article.authorUsername}">author</span>
        </a>
    </div>
</main>
</body>
</html>
