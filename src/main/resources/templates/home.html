<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trang chủ - Article')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="main">
    <div class="page-header">
        <h1>Bài viết</h1>
        <a class="btn-primary btn-inline" th:href="@{/articles/new}">Tạo bài viết</a>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(articles)}">
        <p>Chưa có bài viết nào. Hãy tạo bài viết đầu tiên!</p>
    </div>

    <div class="article-list" th:if="${!#lists.isEmpty(articles)}">
        <a class="article-card" th:each="article : ${articles}" th:href="@{/articles/{id}(id=${article.id})}">
            <span class="article-tag" th:text="${article.tag}">tag</span>
            <h2 class="article-title" th:text="${article.title}">Title</h2>
            <p class="article-description" th:text="${article.description}">Description</p>
            <span class="article-meta" th:text="'bởi ' + ${article.authorUsername}">author</span>
        </a>
    </div>
</main>
</body>
</html>
