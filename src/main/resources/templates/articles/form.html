<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Sửa bài viết - Article' : 'Tạo bài viết - Article')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="main">
    <div class="content-card form-page">
        <h1 th:text="${isEdit} ? 'Sửa bài viết' : 'Tạo bài viết'">Tạo bài viết</h1>

        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="${isEdit} ? @{/articles/{id}/edit(id=${articleId})} : @{/articles}"
              th:object="${articleRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" required>
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3" required></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" th:field="*{content}" rows="8" required></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
            </div>
            <div class="form-group">
                <label for="tag">Tag</label>
                <input type="text" id="tag" th:field="*{tag}" required>
                <span class="field-error" th:if="${#fields.hasErrors('tag')}" th:errors="*{tag}"></span>
            </div>
            <div class="form-group form-group-checkbox">
                <label class="checkbox-label" for="lockComment">
                    <input type="checkbox" id="lockComment" th:field="*{lockComment}">
                    <span>Khóa bình luận</span>
                </label>
                <span class="field-error" th:if="${#fields.hasErrors('lockComment')}" th:errors="*{lockComment}"></span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary" th:text="${isEdit} ? 'Lưu' : 'Tạo'">Tạo</button>
                <a class="btn-secondary" th:href="${isEdit} ? @{/articles/{id}(id=${articleId})} : @{/home}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
