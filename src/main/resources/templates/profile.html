<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa thông tin - Article</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a class="logo" th:href="@{/home}">Article</a>
        <div class="user-menu" th:if="${currentUser != null}">
            <span class="user-info" th:text="${currentUser.username}">username</span>
            <a class="btn-link" th:href="@{/profile}">Sửa thông tin</a>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-link btn-logout">Đăng xuất</button>
            </form>
        </div>
    </div>
</header>
<main class="main">
    <div class="content-card profile-card">
        <h1>Sửa thông tin</h1>

        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

        <form th:action="@{/profile}" th:object="${updateProfileRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:value="${currentUser.email}" disabled>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" required>
                <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">Lưu</button>
                <a class="btn-secondary" th:href="@{/home}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
